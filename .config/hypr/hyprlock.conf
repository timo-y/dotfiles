# Hyprlock — Hyprland-native lock screen.
#
# Launched by swayidle from hyprland.lua:
#   swayidle -w timeout 3600 'hyprlock' before-sleep 'hyprlock'
#
# `path = screenshot` locks on a blurred screenshot of the current desktop.
# If screencopy is unavailable it falls back to the background colour.

$font = GeistMono Nerd Font

general {
    hide_cursor        = false
    ignore_empty_input = true
    fail_timeout       = 2000 # ms the fail message stays visible
}

animations {
    enabled = true
    bezier  = quick, 0.15, 0, 0.1, 1
    animation = fadeIn, 1, 5, quick
    animation = fadeOut, 1, 5, quick
    animation = inputFieldDots, 1, 2, quick
}

background {
    monitor = 
    path = screenshot

    # Same palette as the waybar/i3/sway configs.
    color = rgba(28, 27, 25, 1.0)

    blur_passes = 4
    blur_size   = 6
    brightness  = 0.75
    contrast    = 1.0
}

input-field {
    monitor = 
    size = 320, 52
    rounding = 10
    outline_thickness = 2

    inner_color = rgba(28, 27, 25, 0.85) # #1C1B19
    outer_color = rgb(44, 120, 191)      # #2C78BF
    check_color = rgb(81, 159, 80)       # #519F50
    fail_color  = rgb(239, 47, 39)       # #EF2F27

    font_color = rgb(252, 232, 195)      # #FCE8C3
    font_family = $font
    fade_on_empty = false

    placeholder_text = <span foreground="##917E6B">Password…</span>
    fail_text = <span foreground="##EF2F27"><i>$FAIL</i> <b>($ATTEMPTS)</b></span>

    dots_size    = 0.2
    dots_spacing = 0.4
    dots_center  = true

    position = 0, -60
    halign   = center
    valign   = center
}

label {
    monitor = 
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgba(252, 232, 195, 1.0) # #FCE8C3

    position = 0, 180
    halign   = center
    valign   = center
}

label {
    monitor = 
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = rgba(145, 126, 107, 1.0) # #917E6B

    position = 0, 110
    halign   = center
    valign   = center
}
