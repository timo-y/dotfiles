# Empty glob (laptop without overlay) is a no-op — hyprland accepts zero-match globs.
source = ~/.config/hypr/host.d/*.conf

# Execute at launch
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY XAUTHORITY
exec-once = systemctl --user import-environment XDG_SESSION_TYPE XDG_SESSION_CLASS
exec-once = dbus-update-activation-environment --systemd --all
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = swaybg -m fill -i ~/.config/hypr/background.jpg

# Screen lock (equivalent to xss-lock + xset s 3600 — 1 hour idle)
exec-once = swayidle -w timeout 3600 'swaylock -f' before-sleep 'swaylock -f'

# Auto-start applications on specific workspaces
exec-once = [workspace 1 silent] alacritty -e tmux
exec-once = [workspace 2 silent] alacritty -e yazi
exec-once = [workspace 3 silent] brave
exec-once = [workspace 4 silent] discord
exec-once = [workspace 5 silent] betterbird
exec-once = caffeine

# Input configuration
input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0  # Matches i3's "focus_follows_mouse no"

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
}

general {
    gaps_in = 1
    gaps_out = 5
    border_size = 0          # Matches i3's "new_window none" / "new_float none"
    col.active_border = rgb(bd93f9)
    col.inactive_border = rgba(6272a4aa)

    layout = dwindle
}

misc {
    disable_hyprland_logo = yes
    disable_splash_rendering = yes
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

decoration {
    rounding = 2

    blur {
        enabled = true
        size = 7
        passes = 3
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = yes
}

gestures {
    # workspace_swipe = off
}

# Window rules - assign applications to workspaces
windowrule = workspace 3, match:class .*brave.*
windowrule = workspace 3, match:class .*thorium.*
windowrule = workspace 4, match:class .*discord.*
windowrule = workspace 5, match:class .*thunderbird.*
windowrule = workspace 5, match:class .*betterbird.*
windowrule = workspace 6, match:class .*heroic.*
windowrule = workspace 6, match:class .*steam.*

# Transparency Rules
windowrule = opacity 0.95 0.95, match:class .*alacritty.*
windowrule = opacity 0.90 0.90, match:class .*thunar.*

# Variables
$mod = SUPER
$terminal = alacritty

# ── Terminal ────────────────────────────────────────────────────────────────
bind = $mod, Return,       exec, $terminal -e tmux
bind = $mod SHIFT, Return, exec, $terminal -e nvim .

# ── Kill focused window ──────────────────────────────────────────────────────
bind = $mod SHIFT, Q, killactive

# ── Application launchers (matching i3 exactly) ──────────────────────────────
bind = $mod, D, exec, dmenu_run
bind = $mod, B, exec, brave
bind = $mod, N, exec, upnote
bind = $mod, M, exec, betterbird
bind = $mod, A, exec, pavucontrol

# ── Screenshots ──────────────────────────────────────────────────────────────
bind = $mod SHIFT, S, exec, flameshot gui

# ── Audio device switching ───────────────────────────────────────────────────
bind = $mod CTRL, N, exec, pactl set-default-sink $(pactl list short sinks | grep -i 'usb' | head -n1 | cut -f2) && notify-send 'Audio' 'Switched to Headset'
bind = $mod CTRL, S, exec, pactl set-default-sink $(pactl list short sinks | grep -i 'umc404hd' | head -n1 | cut -f2) && notify-send 'Audio' 'Switched to UMC404HD'

# ── Dark/Light mode ──────────────────────────────────────────────────────────
bind = $mod SHIFT, B, exec, gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
bind = $mod SHIFT, M, exec, gsettings set org.gnome.desktop.interface color-scheme 'prefer-light'

# ── Volume control ───────────────────────────────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# ── Focus (vim keys) ─────────────────────────────────────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# ── Move windows (vim keys) ──────────────────────────────────────────────────
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# ── Layout (matching i3: $mod+v toggles split, $mod+Shift+v splits) ──────────
bind = $mod, V,       layoutmsg, togglesplit
bind = $mod SHIFT, V, layoutmsg, togglesplit  # closest Hyprland equivalent

# ── Layout modes ($mod+x: toggle tabbed/stacking; $mod+Shift+x: border) ─────
bind = $mod, X,       togglegroup               # tabbed/stacking equivalent
bind = $mod SHIFT, X, pseudo,                   # closest to border toggle (no direct equivalent)

# ── Fullscreen ───────────────────────────────────────────────────────────────
bind = $mod, F, fullscreen

# ── Floating ($mod+Shift+f matches i3) ──────────────────────────────────────
bind = $mod SHIFT, F, togglefloating

# ── Reload ($mod+Shift+c) / Restart ($mod+Shift+r) ───────────────────────────
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload  # no true "restart" in Hyprland; reload is the equivalent

# ── Exit ─────────────────────────────────────────────────────────────────────
bind = $mod SHIFT, E, exit

# ── Workspace switching ───────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Numpad workspace switching (Num Lock on)
bind = $mod, KP_End,    workspace, 1
bind = $mod, KP_Down,   workspace, 2
bind = $mod, KP_Next,   workspace, 3
bind = $mod, KP_Left,   workspace, 4
bind = $mod, KP_Begin,  workspace, 5
bind = $mod, KP_Right,  workspace, 6
bind = $mod, KP_Home,   workspace, 7
bind = $mod, KP_Up,     workspace, 8
bind = $mod, KP_Prior,  workspace, 9
bind = $mod, KP_Insert, workspace, 10

# ── Move window to workspace ─────────────────────────────────────────────────
# (i3 behaviour: move AND follow — use movetoworkspace to match)
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Numpad move to workspace (with follow, matching i3's ; workspace number $wsN)
bind = $mod SHIFT, KP_End,    movetoworkspace, 1
bind = $mod SHIFT, KP_Down,   movetoworkspace, 2
bind = $mod SHIFT, KP_Next,   movetoworkspace, 3
bind = $mod SHIFT, KP_Left,   movetoworkspace, 4
bind = $mod SHIFT, KP_Begin,  movetoworkspace, 5
bind = $mod SHIFT, KP_Right,  movetoworkspace, 6
bind = $mod SHIFT, KP_Home,   movetoworkspace, 7
bind = $mod SHIFT, KP_Up,     movetoworkspace, 8
bind = $mod SHIFT, KP_Prior,  movetoworkspace, 9
bind = $mod SHIFT, KP_Insert, movetoworkspace, 10

# ── Mouse bindings ────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── window_movements mode (equivalent to i3's $mod+r mode) ───────────────────
# Hyprland doesn't have named modes, but you can use a submap instead
submap = window_movements

bind = , H, movewindow, l
bind = , J, movewindow, d
bind = , K, movewindow, u
bind = , L, movewindow, r

bind = , KP_End,    movetoworkspace, 1
bind = , KP_Down,   movetoworkspace, 2
bind = , KP_Next,   movetoworkspace, 3
bind = , KP_Left,   movetoworkspace, 4
bind = , KP_Begin,  movetoworkspace, 5
bind = , KP_Right,  movetoworkspace, 6
bind = , KP_Home,   movetoworkspace, 7
bind = , KP_Up,     movetoworkspace, 8
bind = , KP_Prior,  movetoworkspace, 9
bind = , KP_Insert, movetoworkspace, 10

bind = , Return, submap, reset
bind = , Escape, submap, reset

submap = reset

# Enter window_movements submap ($mod+r, matching i3)
bind = $mod, R, submap, window_movements
