# LEGACY hyprlang config — only read by Hyprland < 0.57.
# Hyprland 0.57+ reads ~/.config/hypr/hyprland.lua instead; that file is the
# active, canonical config. This file is kept in sync for older builds.
#
# Hyprland config — mirrors ~/.config/i3/config.
# Wayland translations follow ~/.config/sway/config (same i3 source of truth).

# Host-specific monitor/workspace config lives in hosts/<name>/.config/hypr/host.d/
# Empty glob (laptop without overlay) is a no-op — hyprland accepts zero-match globs.
source = ~/.config/hypr/host.d/*.conf

# ── Session / portals ────────────────────────────────────────────────────────
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY XAUTHORITY
exec-once = systemctl --user import-environment XDG_SESSION_TYPE XDG_SESSION_CLASS
exec-once = dbus-update-activation-environment --systemd --all
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# i3: exec --no-startup-id dex --autostart --environment i3
# dex is not installed by setup.sh; uncomment after installing it.
# exec-once = dex --autostart --environment hyprland

# Optional session startup hook (skip cleanly if it does not exist).
exec-once = [ -f ~/.desktop-session/startup ] && bash ~/.desktop-session/startup

# Bar (waybar is Hyprland's i3bar/i3status-rs equivalent) and notifications.
exec-once = waybar
exec-once = dunst
exec-once = nm-applet --indicator

# i3: exec_always feh --bg-fill ~/.config/hypr/background.jpg
exec-once = swaybg -m fill -i ~/.config/hypr/background.jpg

# Screen lock (i3: xset s 3600 + xss-lock/i3lock — 1 hour idle)
exec-once = swayidle -w timeout 3600 'swaylock -f' before-sleep 'swaylock -f'

# Auto-start applications (i3 assigns them to workspaces, tags pin the target)
exec-once = [workspace 1 silent] env GTK_IM_MODULE=gtk-im-context-simple ghostty -e tmux
exec-once = [workspace 3 silent] brave
exec-once = [workspace 4 silent] discord
exec-once = [workspace 5 silent] betterbird
exec-once = caffeine

# Return to workspace 3 after startup (i3: i3-msg 'workspace 3')
exec-once = sleep 4 && hyprctl dispatch workspace 3

# ── Input ────────────────────────────────────────────────────────────────────
input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # i3 relies on Num Lock for its Mod4+mod2+KP_* numpad binds; the numpad
    # binds below are keycode-based, so this only affects typing digits.
    numlock_by_default = true

    follow_mouse = 0  # i3: focus_follows_mouse no

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
}

# ── Layout / look (i3: border pixel 1, no gaps, no effects) ──────────────────
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1                    # i3: for_window [class=".*"] border pixel 1
    col.active_border = rgb(2C78BF)    # i3: client.focused border/child_border
    col.inactive_border = rgb(3B3935)  # i3: client.unfocused border
    no_border_on_floating = true       # i3: new_float none
    resize_on_border = true

    layout = dwindle
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

# i3 has no animations; set enabled = true if you prefer Hyprland's defaults.
animations {
    enabled = false
}

misc {
    disable_hyprland_logo = yes
    disable_splash_rendering = yes
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

dwindle {
    preserve_split = yes
}

# ── Window rules (i3: assign [class="..."]) ──────────────────────────────────
windowrule = workspace 3, match:class .*(brave|thorium).*
windowrule = workspace 4, match:class .*discord.*
# windowrule = workspace 5, match:class .*upnote.*
windowrule = workspace 5, match:class .*(thunderbird|betterbird|mail).*
windowrule = workspace 6, match:class .*(heroic|steam).*

# ── Variables ────────────────────────────────────────────────────────────────
$mod = SUPER
$terminal = ghostty
# Ghostty's GTK4 Wayland IM can drop dead-key compose; force the simple IM
# context (same workaround as i3/sway, also set in ~/.xprofile).
$term_env = env GTK_IM_MODULE=gtk-im-context-simple

# ── Terminal ─────────────────────────────────────────────────────────────────
bind = $mod, Return,       exec, $term_env $terminal -e tmux
bind = $mod SHIFT, Return, exec, $term_env $terminal -e nvim .

# ── Kill focused window ──────────────────────────────────────────────────────
bind = $mod SHIFT, Q, killactive

# ── Program launcher (i3: dmenu_run; dmenu is X11-only, wofi is the Wayland
# equivalent and mirrors sway's run/drun split) ──────────────────────────────
bind = $mod, D, exec, wofi --show run --define run-always_parse_args=true --exec-search
bind = $mod SHIFT, D, exec, wofi --show drun

# ── Focus (vim keys) ─────────────────────────────────────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# ── Move windows (vim keys) ──────────────────────────────────────────────────
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# ── Layout (i3: $mod+x tabbed/stacking, $mod+v split toggle) ─────────────────
bind = $mod, X,       togglegroup
bind = $mod, V,       layoutmsg, togglesplit
bind = $mod SHIFT, V, layoutmsg, togglesplit
# No Hyprland equivalent for i3's $mod+Shift+x (per-window border toggle):
# borders are a single global setting here.

# ── Fullscreen / floating ────────────────────────────────────────────────────
bind = $mod, F,       fullscreen
bind = $mod SHIFT, F, togglefloating
# No equivalent for i3's $mod+space (focus mode_toggle): Hyprland has no
# tiling<->floating focus switch.

# ── Reload / exit (i3: reload, restart, exit) ────────────────────────────────
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload  # no in-place restart in Hyprland
bind = $mod SHIFT, E, exit

# ── Workspace switching ──────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Numpad workspace switching by physical keycode (XKB/xev code = evdev + 8).
# i3 needs mod2+KP_* (Num Lock on); keycodes also work with Num Lock off —
# same approach as `bindcode` in the sway config.
bind = $mod, code:87, workspace, 1
bind = $mod, code:88, workspace, 2
bind = $mod, code:89, workspace, 3
bind = $mod, code:83, workspace, 4
bind = $mod, code:84, workspace, 5
bind = $mod, code:85, workspace, 6
bind = $mod, code:79, workspace, 7
bind = $mod, code:80, workspace, 8
bind = $mod, code:81, workspace, 9
bind = $mod, code:90, workspace, 10

# ── Move window to workspace (i3 moves AND follows: movetoworkspace) ─────────
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Numpad move to workspace (with follow)
bind = $mod SHIFT, code:87, movetoworkspace, 1
bind = $mod SHIFT, code:88, movetoworkspace, 2
bind = $mod SHIFT, code:89, movetoworkspace, 3
bind = $mod SHIFT, code:83, movetoworkspace, 4
bind = $mod SHIFT, code:84, movetoworkspace, 5
bind = $mod SHIFT, code:85, movetoworkspace, 6
bind = $mod SHIFT, code:79, movetoworkspace, 7
bind = $mod SHIFT, code:80, movetoworkspace, 8
bind = $mod SHIFT, code:81, movetoworkspace, 9
bind = $mod SHIFT, code:90, movetoworkspace, 10

# i3: move workspace to output next (relative monitor index, wraps)
bind = $mod SHIFT, N, movecurrentworkspacetomonitor, +1

# ── Audio / brightness function keys (i3: pactl + brightnessctl) ─────────────
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# ── Application launchers ────────────────────────────────────────────────────
bind = $mod, B, exec, brave
bind = $mod, N, exec, upnote
bind = $mod, M, exec, betterbird
bind = $mod, A, exec, pavucontrol

# ── Screenshots ──────────────────────────────────────────────────────────────
bind = $mod SHIFT, S, exec, flameshot gui

# ── Audio device switching ───────────────────────────────────────────────────
bind = $mod CTRL, N, exec, pactl set-default-sink $(pactl list short sinks | grep -i 'usb' | head -n1 | cut -f2) && notify-send 'Audio' 'Switched to Headset'
bind = $mod CTRL, S, exec, pactl set-default-sink $(pactl list short sinks | grep -i 'umc404hd' | head -n1 | cut -f2) && notify-send 'Audio' 'Switched to UMC404HD'

# ── Prefer dark/light ────────────────────────────────────────────────────────
bind = $mod SHIFT, B, exec, gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
bind = $mod SHIFT, M, exec, gsettings set org.gnome.desktop.interface color-scheme 'prefer-light'

# ── Mouse bindings (i3 leaves these commented out; kept for convenience) ─────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── window_movements submap (i3: mode "window_movements", $mod+r) ────────────
submap = window_movements

bind = , H, movewindow, l
bind = , J, movewindow, d
bind = , K, movewindow, u
bind = , L, movewindow, r

bind = , code:87, movetoworkspace, 1
bind = , code:88, movetoworkspace, 2
bind = , code:89, movetoworkspace, 3
bind = , code:83, movetoworkspace, 4
bind = , code:84, movetoworkspace, 5
bind = , code:85, movetoworkspace, 6
bind = , code:79, movetoworkspace, 7
bind = , code:80, movetoworkspace, 8
bind = , code:81, movetoworkspace, 9
bind = , code:90, movetoworkspace, 10

bind = , Return, submap, reset
bind = , Escape, submap, reset

submap = reset

bind = $mod, R, submap, window_movements
