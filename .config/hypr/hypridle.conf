# Hypridle — Hyprland-native idle/lock daemon.
#
# Started from hyprland.lua:
#   hl.exec_cmd("pidof hypridle >/dev/null || hypridle")
#
# Only ONE lock daemon may own the session. hyprlock has no single-instance
# check of its own, so whenever two triggers fire on the same event (e.g. the
# shipped hypridle.service *and* swayidle both reacting to logind's
# PrepareForSleep when the lid closes) you get two stacked lock screens: unlock
# one and the second one is still there. Hence:
#   * exactly one daemon is started (pidof guard in hyprland.lua), and
#   * every hyprlock spawn goes through lock_cmd's `pidof hyprlock ||` guard,
#     so even a stray second daemon cannot stack a second lock screen.

general {
    # Single spawn point for hyprlock, with the guard hyprlock lacks.
    lock_cmd = pidof hyprlock >/dev/null || hyprlock

    # Lid close -> logind suspends -> lock before sleeping. `loginctl
    # lock-session` emits the session Lock signal, which hypridle turns into
    # lock_cmd (same path as an idle timeout), so there is one guarded spawn.
    before_sleep_cmd = loginctl lock-session

    # Turn the panel back on after resume without needing a key press.
    # Hyprland >= 0.57 Lua dispatcher, same form as hyprland.lua.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# i3 parity: lock after one hour idle (i3: `xset s 3600` + xss-lock).
listener {
    timeout    = 3600
    on-timeout = loginctl lock-session
}
