# Enable OSC 52 clipboard integration
set -s set-clipboard on
# ===========================
# Tmux Configuration
# ===========================

# # Change prefix from Ctrl-b to Ctrl-a (more ergonomic)
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Set longer scrollback history
set -g history-limit 50000

# Enable 256 color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reduce escape time for better vim experience
set -sg escape-time 0

# Increase repeat time for repeatable commands
set -g repeat-time 1000

# Focus events enabled for terminals that support them
set -g focus-events on

# ===========================
# Keybindings
# ===========================

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation with prefix (traditional)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl+h/j/k/l for pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching with Alt+numpad (works with NumLock on)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Switch windows with prefix + number
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Easier window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Copy mode using vim keybindings
setw -g mode-keys vi
bind v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Paste from tmux buffer
bind p paste-buffer

# Kill pane without confirmation
bind x kill-pane

# Kill window without confirmation
bind X kill-window

# Toggle synchronize panes
bind S setw synchronize-panes

# ===========================
# Status Bar Configuration
# ===========================

# Status bar position
set -g status-position top

# Update status bar every second
set -g status-interval 1

# Center window list
set -g status-justify centre

# Status bar colors (matching your i3 Dracula-inspired theme)
set -g status-style 'bg=#1a1a2e fg=#f8f8f2'

# Left status: session name
set -g status-left-length 50
set -g status-left '#[fg=#bd93f9,bold]  #S #[fg=#44475a]| '

# Right status: date and time (matching your system)
set -g status-right-length 100
set -g status-right '#[fg=#44475a]| #[fg=#50fa7b]%Y-%m-%d #[fg=#44475a]| #[fg=#8be9fd]%H:%M:%S '

# Window status format
setw -g window-status-format '#[fg=#6272a4] #I:#W '
setw -g window-status-current-format '#[fg=#bd93f9,bold] #I:#W '

set -g pane-active-border-style 'fg=#bd93f9'

# Message style
set -g message-style 'bg=#6272a4 fg=#f8f8f2 bold'

# Clock mode color (prefix + t)
setw -g clock-mode-colour '#bd93f9'

# ===========================
# Window and Pane Settings
# ===========================

# Aggressive resize (useful for multi-monitor)
setw -g aggressive-resize on

# Monitor activity in other windows
setw -g monitor-activity on
set -g visual-activity off

# Don't rename windows automatically
set -g allow-rename off

# Display pane numbers for longer
set -g display-panes-time 2000

# Image Yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ===========================
# TPM - Tmux Plugin Manager
# ===========================
# Uncomment the following lines to enable TPM and plugins
# Remember to install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
