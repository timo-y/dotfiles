# HOME-PC monitor + workspace layout (mirrors the hypr overlay).
# HDMI-A-1: main landscape display, DP-2: secondary portrait display.
output HDMI-A-1 resolution 1920x1080@100 position 1080 528 scale 1
output DP-2 resolution 1920x1080@60 position 0 0 transform 270 scale 1

# Pin workspaces 1-9 to the main display, 10 to the portrait display.
# Without this, unassigned workspaces are created on whichever output has
# focus (which is how workspace 3 ended up on the wrong screen).
workspace 1 output HDMI-A-1
workspace 2 output HDMI-A-1
workspace 3 output HDMI-A-1
workspace 4 output HDMI-A-1
workspace 5 output HDMI-A-1
workspace 6 output HDMI-A-1
workspace 7 output HDMI-A-1
workspace 8 output HDMI-A-1
workspace 9 output HDMI-A-1
workspace 10 output DP-2
