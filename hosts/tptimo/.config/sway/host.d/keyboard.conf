# tptimo (laptop) keyboard layouts.
# i3 mirrors this in ~/.config/i3/set-keyboard-layouts.sh.

# Laptop keyboard: US layout, with Num Lock on.
# Right Ctrl is Compose (i3: setxkbmap -option compose:rctrl): tap it, then
# " + a → ä, ' + a → á, s + s → ß, etc.
input "type:keyboard" {
    xkb_layout us
    xkb_options compose:rctrl
    xkb_numlock enabled
}

# Corne: German layout (i3: setxkbmap -device <corne> -layout de).
# Sway identifiers are vendor:product:Name, spaces as underscores.
input "1d50:615e:Timos_Corne_Keyboard" {
    xkb_layout de
}
